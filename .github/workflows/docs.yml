name: 'Update Docs'

on:
  push:
    branches:
      - master

jobs:
  docs:
    name: Update Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Packages
        run: npm install
      - name: Build Docs
        run: npm run docs
      - name: Deploy 🚢
        uses: cpina/github-action-push-to-another-repository@master
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'public'
          destination-github-username: 'wslyhbb'
          destination-repository-name: 'ldapjs-promise.github.io'
          user-email: 'wslyhbb@gmail.com'
          target-branch: 'gh-pages'